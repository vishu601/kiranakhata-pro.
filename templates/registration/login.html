<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiranaKhata Pro - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

<div class="container" style="max-width: 450px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">🏪 KiranaKhata <span class="text-warning">Pro</span></h2>
        <p class="text-muted">Dukan ka Digital Udhaar Register</p>
    </div>
    <div class="card p-4">
        <h4 class="mb-3 text-center fw-semibold">Dukandaar Login</h4>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter Username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In</button>
        </form>
        <div class="text-center mt-3">
            <p class="mb-0 text-muted">Nayi dukan hai? <a href="{% url 'signup' %}" class="text-decoration-none fw-bold">Naya Account Banaayein</a></p>
        </div>
    </div>
</div>

</body>
</html>
