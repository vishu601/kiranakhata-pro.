<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiranaKhata Pro | Digital Udhaar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #ff9a9e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .card { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            padding: 40px !important;
        }
        .btn-primary { 
            background: linear-gradient(45deg, #764ba2, #ff758c);
            border: none;
            transition: 0.3s;
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .form-control { border-radius: 10px; padding: 12px; background: #f8f9fa; }
        .text-gradient { 
            background: linear-gradient(to right, #764ba2, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 400px;">
    <div class="text-center mb-4 text-white">
        <h2 class="fw-bold">🏪 KiranaKhata <span class="text-warning">Pro</span></h2>
        <p>Apni dukan ko digital banayein</p>
    </div>
    
    <div class="card">
        <h4 class="mb-4 text-center fw-bold text-gradient">Dukandaar Login</h4>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-muted small">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mt-2 shadow-sm">Sign In Now</button>
        </form>
        
        <div class="text-center mt-4">
            <p class="mb-0 text-muted small">Nayi dukan hai? <a href="{% url 'signup' %}" class="text-decoration-none fw-bold text-gradient">Create Account</a></p>
        </div>
    </div>
</div>

</body>
</html>
